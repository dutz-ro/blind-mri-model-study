[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blind-mri-model-study"
version = "0.1.0"
description = "Reproducible, privacy-gated blind MRI model comparison pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<1",
  "jsonschema>=4.25,<5",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "pydicom>=3.0.2,<4",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
cloud = ["google-cloud-aiplatform>=1.100,<2"]
dicom-codecs = [
  "pylibjpeg>=2.0,<3",
  "pylibjpeg-libjpeg>=2.3,<3",
  "pylibjpeg-openjpeg>=2.4,<3",
]
pdf = ["weasyprint>=66,<70"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
mristudy = "mristudy.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mristudy"]

[tool.hatch.build.targets.wheel.force-include]
"src/mristudy/schemas/knee-meniscus-finding-v2.schema.json" = "mristudy/schemas/knee-meniscus-finding-v2.schema.json"
"src/mristudy/schemas/mri-finding-core-v1.schema.json" = "mristudy/schemas/mri-finding-core-v1.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "backend: requires a live external DICOM-aware backend",
  "google: requires live Google resources",
  "scaleway: requires live Scaleway resources",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
