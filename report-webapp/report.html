<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title data-i18n-title="report.title">Raport radiologic exploratoriu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="report-page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="app.brand"></span></a>
    <nav data-i18n-attr="aria-label:app.nav.label">
      <a href="index.html" data-i18n="app.nav.findings"></a>
      <a class="active" href="report.html" data-i18n="app.nav.report"></a>
      <a href="options.html" data-i18n="app.nav.options"></a>
    </nav>
    <div class="topbar-tools">
      <div class="language-picker" data-language-selector></div>
      <span class="privacy-pill" data-i18n="app.privacyPill"></span>
    </div>
  </header>

  <p class="load-status" data-load-status hidden></p>

  <main class="shell section report-sheet">
    <div class="report-title-row">
      <div>
        <p class="eyebrow" data-i18n="report.eyebrow"></p>
        <h1 data-i18n="report.heading"></h1>
        <p class="lede" data-i18n="report.lede"></p>
      </div>
      <button class="print-button" type="button" id="print-report" data-i18n="report.print"></button>
    </div>

    <section id="report-header" class="report-section"></section>
    <section id="report-vascular" class="report-section"></section>
    <section id="report-results" class="report-section"></section>
    <section id="report-not-assessed" class="report-section not-assessed"></section>
    <section id="report-conclusion" class="report-section conclusion"></section>
    <p class="report-footnote" id="report-footnote"></p>
  </main>

  <footer>
    <div class="shell">
      <strong data-i18n="app.brand"></strong>
      <p data-i18n="app.footer.disclaimer"></p>
      <span data-i18n="app.footer.access"></span>
    </div>
  </footer>

  <script type="module" src="js/report.js"></script>
</body>
</html>
